name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  elt:
    name: Build ELT models and run the test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load raw (E + L)
        run: python src/load_raw.py

      - name: Build models and run the 10 assertions (T)
        # run_elt.py exits non-zero if any test returns offending rows.
        run: python src/run_elt.py

      - name: Run analysis queries
        run: python src/analyze.py

      - name: Render charts
        run: python src/visualize.py

      - name: Assert expected outputs exist
        run: |
          test -f outputs/results/ANALYSIS.md
          test "$(ls outputs/results/*.csv | wc -l)" -eq 10
          test "$(ls outputs/charts/*.png | wc -l)" -eq 5
          echo "10 result sets, 5 charts"

      - name: Re-run is idempotent
        # The models are CREATE OR REPLACE; building twice must converge.
        run: python src/run_elt.py
